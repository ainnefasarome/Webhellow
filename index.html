<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tommy</title>
<link rel="stylesheet" href="style.css">
<script>document.documentElement.classList.add("anim-on");setTimeout(function(){document.documentElement.classList.remove("anim-on")},25000)</script>
<link rel="stylesheet" href="anim.css?v=2">
</head>
<body>
<div class="card">

  <div class="profile">
    <div class="avatar-wrap">
      <div class="avatar">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" fill="#e9d9d3"/>
          <circle cx="50" cy="40" r="19" fill="#c9a08f"/>
          <path d="M20 100c0-24 14-36 30-36s30 12 30 36z" fill="#3a3f4b"/>
          <path d="M30 36c0-14 9-22 21-22s20 7 20 20c-5-8-12-11-22-11-8 0-14 4-19 13z" fill="#4a3228"/>
        </svg>
      </div>
      <div class="badge">
        <svg viewBox="0 0 24 24" width="9" height="9"><path fill="#fff" d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7-6.3-3.8-6.3 3.8 1.7-7L2 9.5l7.1-.6z"/></svg>
      </div>
    </div>
    <div class="info">
      <h1>Tommy</h1>
      <p>Sunny Isles Beach, FL, USA</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="label">Following</span>
      <span class="num">24</span>
    </div>
    <div class="stat">
      <span class="label">Followers</span>
      <span class="num">22</span>
    </div>
  </div>

  <div class="skills">
    <h2>Skills:</h2>
    <div class="chips">

      <span class="chip">
        <i class="ic js">JS</i>Java Script
      </span>

      <span class="chip">
        <i class="ic react">
          <svg viewBox="-12 -12 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="1.4">
            <ellipse rx="10" ry="4"/>
            <ellipse rx="10" ry="4" transform="rotate(60)"/>
            <ellipse rx="10" ry="4" transform="rotate(120)"/>
            <circle r="1.6" fill="#fff" stroke="none"/>
          </svg>
        </i>React
      </span>

      <span class="chip">
        <i class="ic css">3</i>CSS
      </span>

      <span class="chip">
        <i class="ic html">5</i>HTML
      </span>

      <span class="chip">
        <i class="ic redux">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round">
            <path d="M6 18c-3-2-3-7 1-10"/>
            <path d="M12 20c-5 1-8-3-7-6"/>
            <path d="M16 6c4 1 5 6 2 9"/>
          </svg>
        </i>Redux
      </span>

      <span class="chip">
        <i class="ic ex">EX</i>Express
      </span>

      <span class="chip">
        <i class="ic pg">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 6c0-2 3-3 5-3s5 1 5 4c0 4-1 7-2 9-1 2-3 1-3-1v-3"/>
            <path d="M7 6c-2 1-3 4-2 7s2 5 3 5 1-2 1-3"/>
            <circle cx="14" cy="8" r=".6" fill="#fff"/>
          </svg>
        </i>PostgreSQL
      </span>

    </div>
  </div>

  <button class="settings" type="button">ACCOUNT SETTINGS</button>

</div>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<script src="anim.js?v=2"></script>
</body>
</html>
