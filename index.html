<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banghans</title>
<script>document.documentElement.classList.add("anim-on");setTimeout(function(){document.documentElement.classList.remove("anim-on")},25000)</script>
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="anim.css?v=5">
</head>
<body>
<div class="card">

  <div class="profile">
    <div class="avatar-wrap">
      <div class="avatar">
        <canvas id="bslogo" data-w="44" data-h="36"></canvas>
      </div>
    </div>
    <div class="info">
      <h1>Banghans 👋</h1>
      <p>apa yg Sedang Anda pikirkan?</p>
    </div>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="label">Following</span>
      <span class="num">24</span>
    </div>
    <div class="stat">
      <span class="label">Followers</span>
      <span class="num">22</span>
    </div>
  </div>

  <div class="skills">
    <h2>Kasabua Ade</h2>
    <div class="skillgif" id="skillgif" style="aspect-ratio:547/321">
      <img class="ico" data-k="framer" src="ico-framer.webp?v=5" alt="" draggable="false">
      <img class="ico" data-k="notion" src="ico-notion.webp?v=5" alt="" draggable="false">
      <img class="ico" data-k="webflow" src="ico-webflow.webp?v=5" alt="" draggable="false">
      <img class="ico" data-k="hubspot" src="ico-hubspot.webp?v=5" alt="" draggable="false">
      <img class="ico" data-k="figma" src="ico-figma.webp?v=5" alt="" draggable="false">
      <img class="ico" data-k="ga" src="ico-ga.webp?v=5" alt="" draggable="false">
    </div>
  </div>

  <button class="settings" type="button">PELAJARI LEBIH LANJUT</button>

</div>
<audio id="bgm" src="music.mp3" loop preload="auto"></audio>
<script src="logo.js?v=5"></script>
<script src="skills.js?v=5"></script>
<script src="anim.js?v=5"></script>
</body>
</html>
